  <rect x="230" y="402" width="4" height="246" fill="#8a5a30" opacity="0.4"/>
  <rect x="556" y="402" width="16" height="248" fill="#5a381c" stroke="#2a1810" stroke-width="1.4"/>
  <rect x="558" y="404" width="4" height="244" fill="#8a5a30" opacity="0.4"/>
