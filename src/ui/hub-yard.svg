    <rect x="114" y="226" width="32" height="30"/>
    <rect x="164" y="220" width="38" height="36"/>
    <rect x="220" y="224" width="34" height="32"/>
    <rect x="274" y="221" width="36" height="35"/>
    <rect x="330" y="226" width="32" height="30"/>
    <rect x="380" y="220" width="38" height="36"/>
    <rect x="436" y="224" width="34" height="32"/>
