  <circle cx="640" cy="88" r="22" fill="#fff3c0"/>
  <ellipse cx="180" cy="96" rx="70" ry="18" fill="#fff" opacity="0.45"/>
  <ellipse cx="210" cy="88" rx="40" ry="14" fill="#fff" opacity="0.35"/>
