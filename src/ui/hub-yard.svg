<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7eb6d9"/>
      <stop offset="0.45" stop-color="#a8cce6"/>
      <stop offset="1" stop-color="#c5d8a8"/>
    </linearGradient>
    <linearGradient id="plankL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2210"/>
      <stop offset="0.35" stop-color="#7a4e28"/>
      <stop offset="0.7" stop-color="#5a381c"/>
      <stop offset="1" stop-color="#2e1a0c"/>
    </linearGradient>
    <linearGradient id="plankR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e1a0c"/>
      <stop offset="0.3" stop-color="#8a5a30"/>
      <stop offset="0.75" stop-color="#5a381c"/>
      <stop offset="1" stop-color="#3a2210"/>
    </linearGradient>
    <pattern id="ashlar" width="56" height="36" patternUnits="userSpaceOnUse">
      <rect width="56" height="36" fill="#6a6256"/>
      <rect x="0.6" y="0.6" width="26.8" height="16.6" fill="#8a7e6e"/>
      <rect x="28.2" y="0.6" width="26.8" height="16.6" fill="#74685c"/>
      <rect x="0.6" y="18.4" width="18" height="16.8" fill="#6e6458"/>
      <rect x="19.4" y="18.4" width="36" height="16.8" fill="#84786a"/>
      <path d="M1 1 H27 M29 1 H55 M1 18 H55 M1 35 H55 M28 1 V18 M20 18 V35" stroke="#3a3228" stroke-width="1.1" fill="none"/>
    </pattern>
    <pattern id="grass" width="28" height="18" patternUnits="userSpaceOnUse">
      <rect width="28" height="18" fill="#4a7a32"/>
      <path d="M2 18 C3 8 1 6 4 2" stroke="#6aaa44" stroke-width="1.3" fill="none"/>
      <path d="M8 18 C7 10 9 7 7 3" stroke="#3d6a28" stroke-width="1.2" fill="none"/>
      <path d="M14 18 C15 9 13 5 16 1" stroke="#5a9240" stroke-width="1.4" fill="none"/>
      <path d="M20 18 C19 11 21 8 19 4" stroke="#3a6826" stroke-width="1.1" fill="none"/>
      <path d="M25 18 C26 10 24 7 27 3" stroke="#6aaa44" stroke-width="1.2" fill="none"/>
    </pattern>
    <pattern id="dirt" width="22" height="14" patternUnits="userSpaceOnUse">
      <rect width="22" height="14" fill="#7a5a32"/>
      <ellipse cx="6" cy="5" rx="5" ry="3" fill="#8a6a3c"/>
      <ellipse cx="16" cy="9" rx="4" ry="2.5" fill="#6a4a28"/>
    </pattern>
    <pattern id="grain" width="11" height="48" patternUnits="userSpaceOnUse">
      <path d="M2 0 C4 12 1 24 3 48" stroke="#1a1008" stroke-width="0.7" fill="none" opacity="0.45"/>
      <path d="M7 0 C6 16 9 30 6 48" stroke="#c4a070" stroke-width="0.4" fill="none" opacity="0.16"/>
    </pattern>
    <clipPath id="leftLeaf">
      <path d="M246 588 L246 348 Q400 228 400 292 L400 588 Z"/>
    </clipPath>
    <clipPath id="rightLeaf">
      <path d="M400 292 Q400 228 554 348 L554 588 L400 588 Z"/>
