  <!-- grass yard -->
  <rect x="0" y="598" width="800" height="122" fill="url(#grass)"/>
  <path d="M300 598 Q400 640 500 598 L560 720 L240 720 Z" fill="url(#dirt)" opacity="0.92"/>
  <path d="M0 598 C80 592 140 606 220 598" stroke="#3d6a32" stroke-width="8" fill="none" opacity="0.35"/>
  <g fill="#3d6a32">
    <path d="M30 680 C36 650 22 640 34 618"/>
    <path d="M70 700 C78 668 58 658 74 632"/>
    <path d="M760 690 C752 660 770 650 748 628"/>
