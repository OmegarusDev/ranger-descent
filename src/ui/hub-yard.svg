    <rect x="268" y="220" width="22" height="380" fill="#7a4e28"/>
    <rect x="290" y="220" width="20" height="380" fill="#5a381c"/>
    <rect x="310" y="220" width="24" height="380" fill="#8a5a30"/>
    <rect x="334" y="220" width="20" height="380" fill="#4a2a12"/>
    <rect x="354" y="220" width="22" height="380" fill="#6b4424"/>
    <rect x="376" y="220" width="24" height="380" fill="#3a2210"/>
