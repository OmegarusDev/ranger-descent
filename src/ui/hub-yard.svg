    <rect x="400" y="220" width="22" height="380" fill="#3a2210"/>
    <rect x="422" y="220" width="22" height="380" fill="#7a4e28"/>
    <rect x="444" y="220" width="20" height="380" fill="#5a381c"/>
    <rect x="464" y="220" width="24" height="380" fill="#8a5a30"/>
