    <circle cx="349" cy="460" r="16" fill="none" stroke="#7a6a54" stroke-width="4"/>
    <rect x="440" y="428" width="22" height="26" rx="2"/>
    <circle cx="451" cy="460" r="16" fill="none" stroke="#7a6a54" stroke-width="4"/>
