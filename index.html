<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ranger Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
    body {
      font-family: "Chakra Petch", sans-serif;
      color: #e8e4dc;
      display: flex;
      flex-direction: column;
    }
    #game {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }

    .phase {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Hub ── */
    #phase-hub {
      background: rgba(10, 12, 16, 0.92);
      gap: 0;
      padding: 0;
    }
    .hub-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px 12px;
      border-bottom: 1px solid rgba(212,120,58,0.15);
      width: 100%;
      box-sizing: border-box;
    }
    .hub-title {
      font-size: 1.6em;
      color: #d4783a;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .hub-souls {
      color: #c9a227;
      font-size: 1em;
      font-weight: 600;
    }
    .hub-nav {
      display: flex;
      gap: 0;
      width: 100%;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .hub-nav-btn {
      flex: 1;
      padding: 14px 8px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #5a6a7a;
      font-size: 0.85em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .hub-nav-btn:hover { color: #9aa8b8; background: rgba(255,255,255,0.02); }
    .hub-nav-btn.active { color: #d4783a; border-bottom-color: #d4783a; }
    .hub-body {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 20px 24px;
      box-sizing: border-box;
    }
    .hub-panel { display: none; }
    .hub-panel.active { display: block; }
    .hub-panel h2 {
      font-size: 1.15em;
      color: #c9a227;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 16px;
    }
    .hub-bottom {
      padding: 12px 24px 16px;
      border-top: 1px solid rgba(212,120,58,0.15);
      width: 100%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }
    .hub-bottom button { width: 220px; }

    /* Training */
    .train-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      transition: background 0.15s;
    }
    .train-row:hover { background: rgba(255,255,255,0.06); }
    .train-info { display: flex; flex-direction: column; gap: 3px; }
    .train-name { color: #e8e4dc; font-weight: 600; font-size: 0.95em; }
    .train-desc { color: #6a7a8a; font-size: 0.78em; }
    .train-right { display: flex; align-items: center; gap: 12px; }
    .train-level { color: #7a8a9a; font-size: 0.8em; font-variant-numeric: tabular-nums; }
    .train-cost { color: #c9a227; font-size: 0.8em; font-weight: 600; min-width: 50px; text-align: right; }
    .train-buy {
      padding: 6px 14px;
      border: 1px solid #d4783a;
      background: rgba(212,120,58,0.1);
      color: #d4783a;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.78em;
      font-weight: 600;
      transition: all 0.15s;
    }
    .train-buy:hover { background: rgba(212,120,58,0.25); }
    .train-buy:disabled { opacity: 0.3; cursor: default; }
    .train-buy.maxed { border-color: #4a5a4a; color: #4a6a4a; background: transparent; }

    /* Shop */
    .shop-grid { display: flex; flex-direction: column; gap: 16px; }
    .shop-section { display: flex; flex-direction: column; gap: 8px; }
    .shop-section-title { color: #c9a227; font-size: 0.85em; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 4px; border-bottom: 1px solid rgba(201,162,39,0.2); }
    .shop-section-items { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .shop-item {
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.15s;
    }
    .shop-item:hover { background: rgba(255,255,255,0.06); }
    .shop-icon { font-size: 1.6em; margin-bottom: 2px; }
    .shop-name { color: #e8e4dc; font-weight: 600; font-size: 0.9em; }
    .shop-desc { color: #6a7a8a; font-size: 0.75em; line-height: 1.35; }
    .shop-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .shop-cost { color: #c9a227; font-size: 0.82em; font-weight: 600; }
    .shop-buy {
      padding: 5px 12px;
      border: 1px solid #d4783a;
      background: rgba(212,120,58,0.1);
      color: #d4783a;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75em;
      font-weight: 600;
      transition: all 0.15s;
    }
    .shop-buy:hover { background: rgba(212,120,58,0.25); }
    .shop-buy:disabled { opacity: 0.3; cursor: default; }
    .shop-buy.owned { border-color: #4a6a4a; color: #6aaa6a; background: rgba(74,106,74,0.1); }

    /* Equip */
    .equip-layout { display: flex; gap: 20px; }
    .equip-slots { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .equip-slot {
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .equip-slot:hover { background: rgba(255,255,255,0.06); }
    .equip-slot.selected { border-color: #d4783a; background: rgba(212,120,58,0.08); }
    .equip-slot-icon {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3em;
    }
    .equip-slot-info { display: flex; flex-direction: column; gap: 2px; }
    .equip-slot-name { color: #e8e4dc; font-weight: 600; font-size: 0.88em; }
    .equip-slot-item { color: #7a8a9a; font-size: 0.75em; }
    .equip-detail {
      flex: 1;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      min-height: 200px;
    }
    .equip-detail-empty { color: #4a5a6a; font-size: 0.85em; text-align: center; padding-top: 60px; }
    .equip-detail h3 { color: #e8e4dc; font-size: 1em; margin: 0 0 10px; }
    .equip-detail .stat { color: #7a8a9a; font-size: 0.82em; margin-bottom: 4px; }
    .equip-detail .stat b { color: #9aa8b8; }
    .equip-detail .stat-unlock { color: #5a6a5a; font-style: italic; }

    /* Bestiary */
    .bestiary-list { display: flex; flex-direction: column; gap: 8px; }
    .bestiary-entry {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      transition: background 0.15s;
    }
    .bestiary-entry:hover { background: rgba(255,255,255,0.06); }
    .bestiary-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .bestiary-icon-inner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      position: absolute;
    }
    .bestiary-icon-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid;
      position: absolute;
      opacity: 0.4;
    }
    .bestiary-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .bestiary-name { color: #e8e4dc; font-weight: 600; font-size: 0.92em; }
    .bestiary-behavior { color: #6a7a8a; font-size: 0.75em; font-style: italic; }
    .bestiary-stats { display: flex; gap: 14px; flex-shrink: 0; }
    .bestiary-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .bestiary-stat-val { color: #e8e4dc; font-size: 0.82em; font-weight: 600; }
    .bestiary-stat-label { color: #5a6a7a; font-size: 0.6em; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Run HUD ── */
    #phase-run {
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 8px 12px;
      pointer-events: none;
    }
    #phase-run > * { pointer-events: auto; }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(10, 12, 16, 0.7);
      border-radius: 6px;
      font-size: 0.82em;
      gap: 12px;
    }
    .hud-top .souls { color: #c9a227; font-weight: 700; }
    .hud-top .wave { color: #9ec8e8; font-weight: 600; }
    .hud-top .dist { color: #7a8a9a; }
    .hud-top .timer { color: #7a8a9a; font-variant-numeric: tabular-nums; }

    .hp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      padding: 0 2px;
    }
    .hp-bar-bg {
      flex: 1;
      height: 6px;
      background: rgba(20, 16, 12, 0.8);
      border-radius: 3px;
      overflow: hidden;
    }
    #hp-fill {
      height: 100%;
      background: #8fbf6a;
      border-radius: 3px;
      transition: width 0.15s;
    }
    #hp-text {
      font-size: 0.7em;
      color: #8fbf6a;
      font-weight: 600;
      min-width: 50px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ── Magic bars ── */
    .magic-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      justify-content: center;
    }
    .magic-icon {
      position: relative;
      width: 36px;
      height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .magic-icon.ready { opacity: 1; }
    .magic-icon svg { flex-shrink: 0; }
    .magic-label {
      font-size: 0.55em;
      color: #7a8a9a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 1px;
      white-space: nowrap;
    }

    /* ── Minimap ── */
    .minimap-wrap {
      position: absolute;
      right: 10px;
      top: 100px;
      width: 48px;
      height: 180px;
      border: 1px solid rgba(70, 82, 96, 0.3);
      border-radius: 4px;
      overflow: hidden;
    }
    #minimap {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Arrow queue (bottom) ── */
    .arrow-queue-wrap {
      position: absolute;
      bottom: 12px;
      left: 12px;
      pointer-events: none;
    }
    .arrow-queue {
      display: flex;
      gap: 4px;
    }
    .arrow-card {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(20, 16, 12, 0.85);
      border: 1px solid rgba(100, 120, 140, 0.3);
      border-radius: 4px;
      font-size: 0.7em;
      font-weight: 600;
      color: #d8d2c4;
      text-transform: uppercase;
    }
    .arrow-card.fire { border-color: rgba(224, 122, 58, 0.5); color: #e07a3a; }
    .arrow-card.ice { border-color: rgba(126, 184, 201, 0.5); color: #7eb8c9; }
    .arrow-card.oil { border-color: rgba(138, 112, 64, 0.5); color: #8a7040; }
    .arrow-card.moss { border-color: rgba(106, 154, 90, 0.5); color: #6a9a5a; }
    .arrow-card.poison { border-color: rgba(154, 107, 184, 0.5); color: #9a6bb8; }
    .arrow-card.piercing { border-color: rgba(232, 213, 160, 0.5); color: #e8d5a0; }

    /* ── Debug ── */
    #debug-panel {
      position: absolute;
      bottom: 16px;
      right: 12px;
      font-size: 10px;
      color: rgba(200,200,200,0.8);
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      font-family: monospace;
      z-index: 999;
    }

    /* ── Death/Victory ── */
    #phase-death {
      background: rgba(10, 12, 16, 0.92);
      gap: 16px;
    }
    #death-stats {
      text-align: center;
      line-height: 1.8;
      font-size: 1.1em;
    }

    /* ── Buttons ── */
    button {
      font-family: "Chakra Petch", sans-serif;
      padding: 12px 32px;
      font-size: 1em;
      font-weight: 700;
      border: 2px solid #d4783a;
      background: rgba(212, 120, 58, 0.12);
      color: #e8e4dc;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    button:hover { background: rgba(212, 120, 58, 0.28); }
    button:active { background: rgba(212, 120, 58, 0.4); }
    .btn-secondary {
      border-color: #4a5564;
      background: rgba(74, 85, 100, 0.12);
    }
    .btn-secondary:hover { background: rgba(74, 85, 100, 0.28); }
    .btn-group { display: flex; gap: 12px; margin-top: 12px; }

    #junction-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }
    #junction-overlay.active {
      display: flex;
    }
    .junction-choice-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(212, 120, 58, 0.2);
      border: 2px solid #d4783a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.15s;
    }
    .junction-choice-btn:hover {
      background: rgba(212, 120, 58, 0.5);
    }
    .junction-choice-btn .arrow-icon {
      width: 36px;
      height: 36px;
    }
    .junction-choice-btn .enemy-label {
      font-size: 0.6em;
      color: #9aa8b8;
      margin-top: 4px;
      text-align: center;
      max-width: 80px;
      line-height: 1.2;
    }
    .junction-title {
      color: #d4783a;
      font-size: 1.1em;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(212, 120, 58, 0.5);
      pointer-events: none;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <!-- Hub -->
    <div id="phase-hub" class="phase" style="display:flex">
      <div class="hub-top">
        <span class="hub-title">Ranger Defense</span>
        <span class="hub-souls">Souls: <span id="hub-souls">0</span></span>
      </div>
      <div class="hub-nav">
        <button class="hub-nav-btn active" data-panel="training">Training</button>
        <button class="hub-nav-btn" data-panel="shop">Shop</button>
        <button class="hub-nav-btn" data-panel="equip">Equip</button>
        <button class="hub-nav-btn" data-panel="bestiary">Bestiary</button>
      </div>
      <div class="hub-body">
        <div id="panel-training" class="hub-panel active">
          <h2>Training</h2>
          <div id="training-list"></div>
        </div>
        <div id="panel-shop" class="hub-panel">
          <h2>Shop</h2>
          <div id="shop-list" class="shop-grid"></div>
        </div>
        <div id="panel-equip" class="hub-panel">
          <h2>Equipment</h2>
          <div class="equip-layout">
            <div class="equip-slots" id="equip-slots"></div>
            <div class="equip-detail" id="equip-detail">
              <div class="equip-detail-empty">Select a slot to view details</div>
            </div>
          </div>
        </div>
        <div id="panel-bestiary" class="hub-panel">
          <h2>Bestiary</h2>
          <div id="bestiary-list" class="bestiary-list"></div>
        </div>
      </div>
      <div class="hub-bottom">
        <button id="btn-start">Start Run</button>
      </div>
    </div>

    <!-- Run HUD -->
    <div id="phase-run" class="phase">
      <div class="hud-top">
        <span class="souls">Souls: <span id="souls-display">0</span></span>
        <span class="wave" id="wave-display">Wave 0</span>
        <span class="dist" id="distance-display">0m</span>
        <span class="timer" id="timer-display">0:00</span>
      </div>

      <div class="hp-row">
        <div class="hp-bar-bg"><div id="hp-fill" style="width:100%"></div></div>
        <span id="hp-text">100 / 100</span>
      </div>

      <div class="magic-row" id="hex-bar"></div>
      <div class="magic-row" id="prayer-bar"></div>

      <div class="minimap-wrap">
        <canvas id="minimap" width="48" height="180"></canvas>
      </div>

      <div class="arrow-queue-wrap">
        <div class="arrow-queue" id="queue-display"></div>
      </div>

      <div id="debug-panel">debug</div>

      <!-- Junction choice -->
      <div id="junction-overlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; justify-content:center; align-items:center;">
      </div>
    </div>

    <!-- Death / Victory -->
    <div id="phase-death" class="phase">
      <div id="death-stats"></div>
      <div class="btn-group">
        <button id="btn-retry">Try Again</button>
        <button id="btn-hub" class="btn-secondary">Hub</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js?v=2"></script>
</body>
</html>
