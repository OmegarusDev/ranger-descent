<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ranger Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c0907; }
    html { font-size: 18px; }
    body {
      font-family: "Chakra Petch", sans-serif;
      color: #e8dcc4;
      display: flex;
      flex-direction: column;
    }
    #game {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    #ui > * { pointer-events: auto; }

    .phase {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Hub ── */
    #phase-hub {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(80, 52, 24, 0.35), transparent 55%),
        linear-gradient(180deg, #16110c 0%, #0c0907 40%, #0a0806 100%);
      gap: 0;
      padding: 0;
    }
    .hub-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px 12px;
      border-bottom: 1px solid rgba(201,162,39,0.28);
      width: 100%;
      box-sizing: border-box;
    }
    .hub-title {
      font-family: "Cinzel", "Chakra Petch", serif;
      font-size: 1.45em;
      color: #e8c56a;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
    }
    .hub-souls {
      color: #c9a227;
      font-size: 1.1em;
      font-weight: 600;
    }
    .hub-nav {
      display: flex;
      gap: 0;
      width: 100%;
      border-bottom: 1px solid rgba(201,162,39,0.18);
    }
    .hub-nav-btn {
      flex: 1;
      min-height: 52px;
      padding: 16px 6px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #7a6a52;
      font-size: 0.95em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .hub-nav-btn:hover { color: #d4b878; background: rgba(201,162,39,0.06); }
    .hub-nav-btn.active { color: #e8c56a; border-bottom-color: #c9a227; }
    .hub-body {
      flex: 1;
      width: 100%;
      overflow-y: auto;
      padding: 20px 24px;
      box-sizing: border-box;
    }
    .hub-panel { display: none; }
    .hub-panel.active { display: block; }
    .hub-panel h2 {
      font-family: "Cinzel", "Chakra Petch", serif;
      font-size: 1.25em;
      color: #e8c56a;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 16px;
    }
    .hub-bottom {
      padding: 12px 24px 16px;
      border-top: 1px solid rgba(201,162,39,0.22);
      width: 100%;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
    }
    .hub-bottom button {
      width: min(380px, 92%);
      padding: 26px 40px;
      font-size: 1.35em;
      letter-spacing: 2px;
    }

    /* Training */
    .train-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px;
      margin-bottom: 10px;
      background: rgba(40, 28, 16, 0.45);
      border: 1px solid rgba(201,162,39,0.16);
      border-radius: 2px;
      transition: background 0.15s;
    }
    .train-row:hover { background: rgba(60, 42, 22, 0.55); }
    .train-info { display: flex; flex-direction: column; gap: 3px; }
    .train-name { color: #f3ead4; font-weight: 600; font-size: 1.05em; }
    .train-desc { color: #8a7348; font-size: 0.88em; }
    .train-right { display: flex; align-items: center; gap: 12px; }
    .train-level { color: #7a8a9a; font-size: 0.9em; font-variant-numeric: tabular-nums; }
    .train-cost { color: #c9a227; font-size: 0.9em; font-weight: 600; min-width: 50px; text-align: right; }
    .train-buy {
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid #c9a227;
      background: rgba(201,162,39,0.1);
      color: #e8c56a;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      font-weight: 600;
      transition: all 0.15s;
    }
    .train-buy:hover { background: rgba(201,162,39,0.25); }
    .train-buy:disabled { opacity: 0.3; cursor: default; }
    .train-buy.maxed { border-color: #4a5a4a; color: #4a6a4a; background: transparent; }
    .train-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      padding: 12px 14px 16px;
      margin-bottom: 12px;
      color: #c9b48a;
      font-size: 0.88em;
      letter-spacing: 0.04em;
      border-bottom: 1px solid rgba(201,162,39,0.2);
    }
    .train-summary .overencumbered,
    .equip-load.overencumbered { color: #c45a4a; }
    .equip-load {
      padding: 8px 4px 12px;
      color: #c9b48a;
      font-size: 0.88em;
    }

    /* Shop */
    .shop-grid { display: flex; flex-direction: column; gap: 10px; }
    .shop-section { display: flex; flex-direction: column; gap: 4px; }
    .shop-section-title {
      color: #c9a227;
      font-size: 0.9em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 10px 6px;
      border-bottom: 1px solid rgba(201,162,39,0.2);
      cursor: pointer;
      user-select: none;
    }
    .shop-section-title:hover { background: rgba(201,162,39,0.08); }
    .shop-section-items { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .shop-item {
      padding: 12px 10px;
      background: rgba(40, 28, 16, 0.45);
      border: 1px solid rgba(201,162,39,0.16);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background 0.15s;
    }
    .shop-item:hover { background: rgba(60, 42, 22, 0.55); }
    .shop-icon { font-size: 1.35em; }
    .shop-name { color: #f3ead4; font-weight: 600; font-size: 0.88em; }
    .shop-desc { color: #8a7348; font-size: 0.78em; line-height: 1.3; }
    .shop-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .shop-cost { color: #c9a227; font-size: 0.82em; font-weight: 600; }
    .shop-buy {
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid #c9a227;
      background: rgba(201,162,39,0.1);
      color: #e8c56a;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.78em;
      font-weight: 600;
      transition: all 0.15s;
    }
    .shop-buy:hover { background: rgba(201,162,39,0.25); }
    .shop-buy:disabled { opacity: 0.3; cursor: default; }
    .shop-buy.owned { border-color: #4a6a4a; color: #6aaa6a; background: rgba(74,106,74,0.1); }

    /* Equip */
    .equip-layout { display: flex; gap: 20px; }
    .equip-slots { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .equip-slot {
      min-height: 64px;
      padding: 16px 16px;
      background: rgba(40, 28, 16, 0.45);
      border: 1px solid rgba(201,162,39,0.16);
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .equip-slot:hover { background: rgba(60, 42, 22, 0.55); }
    .equip-slot.selected { border-color: #c9a227; background: rgba(201,162,39,0.1); }
    .equip-slot-icon {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45em;
    }
    .equip-slot-info { display: flex; flex-direction: column; gap: 2px; }
    .equip-slot-name { color: #e8e4dc; font-weight: 600; font-size: 1em; }
    .equip-slot-item { color: #7a8a9a; font-size: 0.88em; }
    .equip-detail {
      flex: 1;
      padding: 16px;
      background: rgba(40, 28, 16, 0.45);
      border: 1px solid rgba(201,162,39,0.16);
      border-radius: 2px;
      min-height: 200px;
    }
    .equip-detail-empty { color: #4a5a6a; font-size: 1em; text-align: center; padding-top: 60px; }
    .equip-detail h3 { color: #e8e4dc; font-size: 1.1em; margin: 0 0 10px; }
    .equip-detail .stat { color: #7a8a9a; font-size: 0.95em; margin-bottom: 4px; }
    .equip-detail .stat b { color: #9aa8b8; }
    .equip-detail .stat-unlock { color: #5a6a5a; font-style: italic; }

    /* Bestiary */
    .bestiary-list { display: flex; flex-direction: column; gap: 8px; }
    .bestiary-entry {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px;
      background: rgba(40, 28, 16, 0.45);
      border: 1px solid rgba(201,162,39,0.16);
      border-radius: 2px;
      transition: background 0.15s;
    }
    .bestiary-entry:hover { background: rgba(60, 42, 22, 0.55); }
    .bestiary-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .bestiary-icon-inner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      position: absolute;
    }
    .bestiary-icon-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid;
      position: absolute;
      opacity: 0.4;
    }
    .bestiary-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .bestiary-name { color: #e8e4dc; font-weight: 600; font-size: 1.05em; }
    .bestiary-behavior { color: #8a7348; font-size: 0.88em; font-style: italic; }
    .bestiary-stats { display: flex; gap: 14px; flex-shrink: 0; }
    .bestiary-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .bestiary-stat-val { color: #e8e4dc; font-size: 0.95em; font-weight: 600; }
    .bestiary-stat-label { color: #5a6a7a; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Run HUD ── */
    #phase-run {
      display: none;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
      pointer-events: none;
    }
    #phase-run,
    #phase-run > * { pointer-events: none !important; }

    #path-choice {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 200;
      pointer-events: auto;
    }
    #path-choice.active { display: flex; }
    #path-choice button {
      flex: 1;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      border-radius: 0;
      border: 3px solid rgba(201, 162, 39, 0.7);
      background: rgba(12, 8, 5, 0.22);
      color: #e8c56a;
      font-family: "Cinzel", "Chakra Petch", serif;
      font-size: 1.8em;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(201, 162, 39, 0.28);
    }
    #path-choice button:active { background: rgba(201, 162, 39, 0.28); }
    #path-choice button[hidden] { display: none; }
    #path-choice button small {
      display: block;
      margin-top: 12px;
      font-family: "Chakra Petch", sans-serif;
      font-size: 0.42em;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #f3ead4;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(16, 12, 8, 0.72);
      border: 1px solid rgba(201, 162, 39, 0.35);
      box-shadow: inset 0 0 0 1px rgba(40, 28, 16, 0.8);
      border-radius: 2px;
      font-size: 0.92em;
      gap: 12px;
      letter-spacing: 0.04em;
    }
    .hud-top .souls { color: #e8c56a; font-weight: 700; }
    .hud-top .wave { color: #d4b878; font-weight: 600; }
    .hud-top .dist { color: #8a7348; }
    .hud-top .timer { color: #8a7348; font-variant-numeric: tabular-nums; }

    .hp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 2px;
    }
    .hp-bar-bg {
      flex: 1;
      height: 10px;
      background: rgba(20, 16, 12, 0.8);
      border-radius: 3px;
      overflow: hidden;
    }
    #hp-fill {
      height: 100%;
      background: #8fbf6a;
      border-radius: 3px;
      transition: width 0.15s;
    }
    #hp-text {
      font-size: 0.85em;
      color: #8fbf6a;
      font-weight: 600;
      min-width: 50px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ── Arrow cooldown circle ── */
    .cooldown-wrap {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cooldown-label {
      position: absolute;
      font-size: 1em;
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Minimap ── */
    .minimap-wrap {
      position: absolute;
      right: 10px;
      top: 100px;
      width: 48px;
      height: 180px;
      border: 1px solid rgba(201, 162, 39, 0.32);
      border-radius: 2px;
      overflow: hidden;
      background: rgba(8, 6, 5, 0.62);
    }
    #minimap {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-aspect-ratio: 3/4) {
      .hub-top { padding: 14px 16px 10px; }
      .hub-body { padding: 16px 16px; }
      .hub-bottom { padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
      .cooldown-wrap { top: 76px; }
      .minimap-wrap { width: 44px; height: 150px; top: 104px; right: 8px; }
      .bottom-bar { left: 8px; right: 52px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
    }
    @media (min-aspect-ratio: 1/1) {
      html { font-size: 16px; }
    }

    /* ── Debug ── */
    #debug-panel {
      display: none;
      position: absolute;
      bottom: 16px;
      right: 12px;
      font-size: 10px;
      color: rgba(200,200,200,0.8);
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      font-family: monospace;
      z-index: 999;
    }

    /* ── Death/Victory ── */
    #phase-death {
      background: rgba(12, 9, 7, 0.94);
      gap: 16px;
    }
    #death-stats {
      text-align: center;
      line-height: 1.8;
      font-size: 1.2em;
    }

    /* ── Buttons ── */
    button {
      font-family: "Chakra Petch", sans-serif;
      min-height: 48px;
      padding: 16px 32px;
      font-size: 1.08em;
      font-weight: 700;
      border: 2px solid #c9a227;
      background: rgba(201, 162, 39, 0.12);
      color: #f3ead4;
      border-radius: 2px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.15s;
    }
    button:hover { background: rgba(201, 162, 39, 0.28); }
    button:active { background: rgba(201, 162, 39, 0.4); }
    .btn-secondary {
      border-color: #4a5564;
      background: rgba(74, 85, 100, 0.12);
    }
    .btn-secondary:hover { background: rgba(74, 85, 100, 0.28); }
    .btn-group { display: flex; gap: 12px; margin-top: 12px; }

    .arrow-card {
      min-width: 64px;
      min-height: 44px;
      padding: 10px 12px;
      background: rgba(24, 16, 10, 0.75);
      border: 1px solid #c9a227;
      border-radius: 2px;
      color: #f3ead4;
      font-size: 0.85em;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <!-- Hub -->
    <div id="phase-hub" class="phase" style="display:flex">
      <div class="hub-top">
        <span class="hub-title">Ranger Defense</span>
        <span class="hub-souls">Souls: <span id="hub-souls">0</span></span>
      </div>
      <div class="hub-nav">
        <button class="hub-nav-btn active" data-panel="training">Training</button>
        <button class="hub-nav-btn" data-panel="shop">Shop</button>
        <button class="hub-nav-btn" data-panel="equip">Equip</button>
        <button class="hub-nav-btn" data-panel="bestiary">Bestiary</button>
      </div>
      <div class="hub-body">
        <div id="panel-training" class="hub-panel active">
          <h2>Training</h2>
          <div id="training-list"></div>
        </div>
        <div id="panel-shop" class="hub-panel">
          <h2>Shop</h2>
          <div id="shop-list" class="shop-grid"></div>
        </div>
        <div id="panel-equip" class="hub-panel">
          <h2>Equipment</h2>
          <div class="equip-layout">
            <div class="equip-slots" id="equip-slots"></div>
            <div class="equip-detail" id="equip-detail">
              <div class="equip-detail-empty">Select a slot to view details</div>
            </div>
          </div>
        </div>
        <div id="panel-bestiary" class="hub-panel">
          <h2>Bestiary</h2>
          <div id="bestiary-list" class="bestiary-list"></div>
        </div>
      </div>
      <div class="hub-bottom">
        <button id="btn-start">Enter Dungeon!</button>
      </div>
    </div>

    <!-- Run HUD -->
    <div id="phase-run" class="phase">
      <div class="hud-top">
        <span class="souls">Souls: <span id="souls-display">0</span></span>
        <span class="wave" id="quiver-display">Arrows 0/6</span>
        <span class="wave" id="wave-display">Fl. 1  1/10</span>
        <span class="dist" id="distance-display">0 ahead</span>
        <span class="timer" id="timer-display">0:00</span>
      </div>

      <div class="cooldown-wrap" id="cooldown-wrap">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
          <circle cx="20" cy="20" r="17" fill="none" stroke="#d4783a" stroke-width="3"
            id="cooldown-ring"
            stroke-dasharray="0 107" stroke-dashoffset="26.7"
            style="transform:rotate(-90deg);transform-origin:center;transition:stroke-dasharray 0.05s"/>
        </svg>
        <span class="cooldown-label" id="cooldown-label">🏹</span>
      </div>

      <div class="minimap-wrap">
        <canvas id="minimap" width="48" height="180"></canvas>
      </div>

      <div class="bottom-bar">
        <div class="hp-row">
          <div class="hp-bar-bg"><div id="hp-fill" style="width:100%"></div></div>
          <span id="hp-text">10 / 10</span>
        </div>
      </div>

      <div id="debug-panel">debug</div>
    </div>

    <!-- Death / Victory -->
    <div id="phase-death" class="phase">
      <div id="death-stats"></div>
      <div class="btn-group">
        <button id="btn-retry">Try Again</button>
        <button id="btn-hub" class="btn-secondary">Hub</button>
      </div>
    </div>

    <div id="path-choice">
      <button type="button" data-dir="left">‹ Left</button>
      <button type="button" data-dir="forward">Ahead</button>
      <button type="button" data-dir="right">Right ›</button>
    </div>
  </div>

  <script type="module" src="src/main.js?v=42"></script>
</body>
</html>
