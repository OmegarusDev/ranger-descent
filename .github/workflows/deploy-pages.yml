name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (game assets only)
        run: |
          set -euo pipefail
          mkdir -p _site/icons
          cp index.html styles.css manifest.webmanifest sw.js _site/
          cp -R icons/. _site/icons/
          # Game source only — no docs, design mocks, scripts, or repo meta.
          cp -R src _site/src
          find _site -name .DS_Store -delete 2>/dev/null || true
          echo "Site contents:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
